<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items - Bihar Portal</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="categories.html">Categories</a>
                <a href="items.html" class="active">Items</a>
            </nav>
        </aside>
        <main class="content">
            <header class="header-flex">
                <h1>Manage Items</h1>
                <a href="editor.html" class="btn primary">Create New Item</a>
            </header>
            
            <div class="card list-card">
                <div class="filters">
                    <div class="custom-dropdown" id="category-dropdown-container">
                        <div class="custom-dropdown-trigger" id="filter-category-trigger">
                            <span id="filter-category-label">All Categories</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                        <div class="custom-dropdown-menu" id="filter-category-menu">
                            <div class="custom-dropdown-item active" data-value="">All Categories</div>
                        </div>
                        <input type="hidden" id="filter-category" value="">
                    </div>
                    <input type="text" id="search-item" placeholder="Search items...">
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Keywords</th>
                            <th>Date</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="items-table-body">
                        <!-- Items will load here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="config.js"></script>
    <script src="js/admin-app.js"></script>
    <script src="js/items-list.js"></script>
</body>
</html>
