<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Editor - Bihar Portal</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="categories.html">Categories</a>
                <a href="items.html" class="active">Items</a>
            </nav>
        </aside>
        <main class="content">
            <header>
                <h1 id="editor-title">Create/Edit Item</h1>
            </header>
            
            <form id="item-editor-form" class="card form-card">
                <div class="form-group">
                    <label for="item-title">Title</label>
                    <input type="text" id="item-title" required>
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <div class="custom-dropdown" id="category-dropdown-container">
                        <div class="custom-dropdown-trigger" id="item-category-trigger">
                            <span id="item-category-label">Select Category</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                        <div class="custom-dropdown-menu" id="item-category-menu">
                            <!-- Options injected by JS -->
                        </div>
                        <input type="hidden" id="item-category">
                    </div>
                </div>

                <div class="form-group">
                    <label>Keywords (Tags)</label>
                    <div class="tags-input-container" id="tags-container">
                        <input type="text" id="tag-input" placeholder="Type and press Enter or comma">
                    </div>
                    <input type="hidden" id="item-tags">
                </div>

                <div class="form-group split-editor">
                    <div class="editor-pane">
                        <label for="item-content">Content (Markdown)</label>
                        <textarea id="item-content" rows="15" required></textarea>
                    </div>
                    <div class="preview-pane">
                        <label>Preview</label>
                        <div id="content-preview" class="markdown-preview"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn secondary" onclick="window.history.back()">Cancel</button>
                    <button type="submit" class="btn primary">Save Item</button>
                </div>
            </form>
        </main>
    </div>
    <script src="config.js"></script>
    <script src="js/admin-app.js"></script>
    <script src="js/keyword-tags.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
